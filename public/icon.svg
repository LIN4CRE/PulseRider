<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.3" stroke-dasharray="16 12" />

  <!-- Mid Concentric Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glow)" stroke-width="14" filter="url(#neon)" opacity="0.9" />

  <!-- Inner Radiant Core -->
  <circle cx="256" cy="256" r="80" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />

  <!-- Dynamic Lightning / Pulse Symbol -->
  <path d="M276 136 L196 264 L244 264 L228 376 L316 240 L268 240 Z" fill="url(#bolt)" filter="url(#neon)" />
  
  <!-- Pulsing Orbit Nodes -->
  <circle cx="256" cy="66" r="14" fill="#06b6d4" />
  <circle cx="446" cy="256" r="14" fill="#ec4899" />
  <circle cx="256" cy="446" r="14" fill="#3b82f6" />
  <circle cx="66" cy="256" r="14" fill="#f43f5e" />
</svg>
